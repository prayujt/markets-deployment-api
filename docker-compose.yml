services:
  redis:
    image: redis:7
    container_name: markets-deployment-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: markets-deployment-postgres
    environment:
      POSTGRES_USER: prayuj
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deployments
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "ssl=off"

volumes:
  pg_data:
